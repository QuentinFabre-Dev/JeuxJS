# LanguageTool, the spelling and grammar engine.
#
# It is a Java service: it runs neither in the browser nor in a Vercel
# function, so it lives in its own container — here for development, on a small
# always-on host in production. Nothing but `/api/lint` should be able to reach
# it.
services:
  languagetool:
    image: erikvl87/languagetool
    ports:
      - '8010:8010'
    environment:
      # 512 MB is enough without the n-gram data; raise both when mounting it.
      Java_Xms: 512m
      Java_Xmx: 1g
      langtool_fasttextBinary: /usr/local/bin/fasttext
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8010/v2/languages']
      interval: 30s
      timeout: 5s
      retries: 3
